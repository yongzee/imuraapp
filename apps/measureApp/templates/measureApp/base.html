{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <title>{% block title %}Imura | Digital Body Measurements{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Manage your clothing measurements with Imura and make it easier to share measurement details with your tailor.{% endblock %}">
  <meta name="robots" content="noindex, follow">
  
  
  <link rel="manifest" href="{% static 'pwa/manifest.json' %}">
  <meta name="theme-color" content="#101B35">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Imura">
  <link rel="apple-touch-icon"
      href="{% static 'pwa/icons/icon-192.png' %}">
  <!-- Bootstrap CSS CDN -->
  <link rel="stylesheet" href="{% static "css/bootstrap.min.css" %}" type="text/css">
  <link href="{% static 'css/style.css' %}  " rel="stylesheet"/>
  <!-- Font Awesome (for icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">MeasureMe</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="{% url "index" %}">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url "howitworks" %}">How it Works</a></li>
          <li class="nav-item"><a class="nav-link" href="#">About</a></li>
        </ul>
      </div>
    </div>
  </nav>
{% block content %}{% endblock content %}


<!-- Footer -->
  <footer class="bg-light py-3 mt-4 border-top">
    <div class="container d-flex justify-content-between flex-wrap text-center">
      <p class="mb-0">&copy; 2025 MeasureMe</p>
      <div>
        <a href="#" class="text-decoration-none me-2 text-muted">Privacy</a>
        <a href="#" class="text-decoration-none me-2 text-muted">Terms</a>
        <a href="#" class="text-decoration-none text-muted">Contact</a>
      </div>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/bootstrap.min.js' %}  "></script>
  <script src="{% static 'pwa/install.js' %}?v=2.1" defer></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/service-worker.js")
          .catch(function (error) {
            console.error("Imura service worker registration failed:", error);
          });
      });
    }
  </script>
</body>
</html>
